name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test language frontend, runtime, numeric crate, and LLVM backend
        run: cargo test
      - name: Check and run the matrix example in the interpreter
        run: |
          cargo run -p sun -- check examples/matrices.sun
          cargo run -p sun -- run examples/matrices.sun
      - name: Compile and execute a native scalar program
        run: |
          printf 'x = 2 + 3 * 4;\ndisp(x);\n' > /tmp/native-scalar.sun
          cargo run -p sun -- compile /tmp/native-scalar.sun -o /tmp/native-scalar
          test "$(/tmp/native-scalar)" = "14"
      - name: Compile and execute native matrix operations and indexing
        run: |
          cat > /tmp/native-matrices.sun <<'SUN'
          A = [1, 2; 3, 4];
          B = A * A;
          C = A .* A;
          disp(B);
          disp(C);
          disp(A(2, 1));
          SUN
          cargo run -p sun -- compile /tmp/native-matrices.sun -o /tmp/native-matrices
          test "$(/tmp/native-matrices)" = "$(printf '7 10 \n15 22 \n1 4 \n9 16 \n3')"

      - name: Compile and execute native math functions through the runtime ABI
        run: |
          printf 'x = sqrt(81);\ny = sin(0);\nz = log(exp(2));\ndisp(x);\ndisp(y);\ndisp(z);\n' > /tmp/native-runtime.sun
          cargo run -p sun -- compile /tmp/native-runtime.sun -o /tmp/native-runtime
          test "$(/tmp/native-runtime)" = "$(printf '9\n0\n2')"
          clang-18 -std=c11 -Wall -Wextra -Werror -c runtime/sun_runtime.c -o /tmp/sun_runtime.o

      - name: Build and test the heap-backed matrix runtime ABI
        run: |
          clang-18 -std=c11 -Wall -Wextra tests/matrix_runtime_abi.c runtime/sun_runtime.c -lm -o /tmp/sun-matrix-runtime-test
          test "$(/tmp/sun-matrix-runtime-test)" = "matrix runtime ABI OK"
