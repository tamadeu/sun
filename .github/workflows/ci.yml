name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test language frontend and runtime
        run: cargo test
      - name: Check and run the matrix example
        run: |
          cargo run -p sun -- check examples/matrices.sun
          cargo run -p sun -- run examples/matrices.sun
